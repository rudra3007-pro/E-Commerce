<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders – ShopKart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div id="app-nav"></div>
  <main class="container" style="padding:16px 16px 64px">
    <h1 style="font-size:22px;font-weight:800;margin-bottom:24px">📦 My Orders</h1>
    <div id="ordersWrap">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('app-header').innerHTML = buildHeader();
    document.getElementById('app-nav').innerHTML = buildCategoryNav();
    document.getElementById('app-footer').innerHTML = buildFooter();

    const statusSteps = ['Processing','Confirmed','Shipped','Out for Delivery','Delivered'];
    const statusColors = {
      'Processing': 'badge-warning',
      'Confirmed': 'badge-info',
      'Shipped': 'badge-info',
      'Out for Delivery': 'badge-warning',
      'Delivered': 'badge-success',
      'Cancelled': 'badge-danger'
    };

    function getStepIdx(status) { return statusSteps.indexOf(status); }

    async function loadOrders() {
      if (!getToken()) {
        document.getElementById('ordersWrap').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📦</div>
            <h3>Please login to view your orders</h3>
            <a href="/login.html" class="btn-checkout" style="display:inline-block;padding:12px 32px;text-decoration:none;margin-top:16px">Login Now</a>
          </div>`;
        return;
      }
      try {
        const orders = await api.get('/orders/my', true);
        if (!orders || orders.length === 0) {
          document.getElementById('ordersWrap').innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📦</div>
              <h3 class="empty-title">No orders yet</h3>
              <p class="empty-subtitle">Start shopping and your orders will appear here</p>
              <a href="/shop.html" class="btn-checkout" style="display:inline-block;padding:12px 32px;text-decoration:none;margin-top:16px">Shop Now</a>
            </div>`;
          return;
        }
        document.getElementById('ordersWrap').innerHTML = orders.map(renderOrder).join('');
      } catch (err) {
        document.getElementById('ordersWrap').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>${err.message}</h3></div>`;
      }
    }

    function renderOrder(order) {
      const stepIdx = getStepIdx(order.orderStatus);
      const date = new Date(order.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
      return `
        <div class="order-card">
          <div class="order-card-header">
            <div>
              <div class="order-id">Order ID: #${order._id.slice(-8).toUpperCase()}</div>
              <div class="order-date">Placed on ${date}</div>
            </div>
            <div class="flex gap-1">
              <span class="badge ${statusColors[order.orderStatus] || 'badge-grey'}">${order.orderStatus}</span>
              <span class="badge badge-grey">${order.paymentMethod}</span>
            </div>
          </div>

          ${order.items.map(item => `
            <div class="order-item-row">
              ${item.image
                ? `<img src="${item.image}" alt="${item.name}" class="order-item-img" onerror="this.style.display='none'">`
                : `<div class="order-item-placeholder">📦</div>`}
              <div style="flex:1">
                <div style="font-size:14px;font-weight:500">${item.name}</div>
                <div style="font-size:13px;color:#717171">Qty: ${item.quantity} × ${formatPrice(item.price)}</div>
              </div>
              <div style="font-weight:700">${formatPrice(item.price * item.quantity)}</div>
            </div>
          `).join('')}

          <!-- Status Tracker -->
          ${order.orderStatus !== 'Cancelled' ? `
          <div style="padding:16px 20px">
            <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:#717171">Order Status</div>
            <div style="display:flex;align-items:center">
              ${statusSteps.map((s, i) => `
                <div style="display:flex;flex-direction:column;align-items:center;flex:1">
                  <div style="display:flex;align-items:center;width:100%">
                    ${i > 0 ? `<div style="flex:1;height:2px;background:${i <= stepIdx ? 'var(--success)' : '#e0e0e0'}"></div>` : ''}
                    <div style="width:16px;height:16px;border-radius:50%;background:${i < stepIdx ? 'var(--success)' : i === stepIdx ? 'var(--primary)' : '#e0e0e0'};flex-shrink:0;${i === stepIdx ? 'box-shadow:0 0 0 4px var(--primary-light)' : ''}"></div>
                    ${i < statusSteps.length - 1 ? `<div style="flex:1;height:2px;background:${i < stepIdx ? 'var(--success)' : '#e0e0e0'}"></div>` : ''}
                  </div>
                  <div style="font-size:10px;margin-top:4px;text-align:center;color:${i <= stepIdx ? 'var(--text-primary)' : '#9e9e9e'};font-weight:${i === stepIdx ? '600' : '400'}">${s.replace(' ','\n')}</div>
                </div>
              `).join('')}
            </div>
          </div>` : ''}

          <div class="order-total">
            <div>
              <div style="font-size:13px;color:#717171">Shipping to: ${order.shippingAddress?.city || 'N/A'}, ${order.shippingAddress?.state || ''}</div>
              <div style="font-size:12px;color:#717171">Payment: ${order.paymentStatus}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:13px;color:#717171">Order Total</div>
              <div class="order-total-amount">${formatPrice(order.totalAmount)}</div>
            </div>
          </div>
        </div>
      `;
    }

    loadOrders();
    updateCartCount();
  </script>
</body>
</html>
